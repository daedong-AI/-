<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초록들판항공 | 프리미엄 상담 예약</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --border: #1e293b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: radial-gradient(circle at top left, #064e3b 0%, transparent 50%), radial-gradient(circle at bottom right, #0f172a 0%, transparent 50%);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        .booking-container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .booking-container {
                grid-template-columns: 1fr;
            }
        }

        /* 왼쪽: 캘린더 및 시간 선택 */
        .calendar-section {
            padding: 40px;
            border-right: 1px solid var(--border);
        }

        .calendar-section h3 {
            margin-top: 0;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .time-slots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .time-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-white);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .time-btn:hover {
            border-color: var(--primary);
        }

        .time-btn.selected {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: bold;
        }

        .time-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* 오른쪽: 고객 정보 폼 */
        .form-section {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: var(--text-gray);
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }

        /* 완료 모달 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-dark);
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid var(--border);
            transform: translateY(30px);
            transition: 0.4s;
            max-width: 400px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .success-icon {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>초록들판항공 전문 상담 예약</h1>
        <p>드론 도입부터 운영 교육까지, 전문가가 맞춤형 솔루션을 제안합니다.</p>
    </div>

    <div class="booking-container">
        <!-- 캘린더 및 시간 -->
        <div class="calendar-section">
            <h3><i class="far fa-calendar-alt"></i> 날짜 선택</h3>
            <input type="text" id="datePicker" class="form-group"
                style="width:100%; padding:15px; border-radius:12px; background:rgba(15,23,42,0.8); border:1px solid var(--border); color:white;"
                placeholder="날짜를 선택해주세요">

            <h3 style="margin-top: 30px;"><i class="far fa-clock"></i> 시간 선택</h3>
            <div class="time-slots" id="timeSlots">
                <div class="time-btn disabled">09:00 (마감)</div>
                <div class="time-btn">10:30</div>
                <div class="time-btn">13:00</div>
                <div class="time-btn">14:30</div>
                <div class="time-btn">16:00</div>
                <div class="time-btn">17:30</div>
            </div>
            <p id="selectedDateTime" style="margin-top: 20px; color: var(--primary); font-weight: bold;"></p>
        </div>

        <!-- 예약 폼 -->
        <div class="form-section">
            <div class="form-group">
                <label>이름 / 회사명</label>
                <input type="text" id="name" placeholder="홍길동" required>
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="tel" id="phone" placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
                <label>관심 분야</label>
                <select id="interest">
                    <option value="">선택해주세요</option>
                    <option value="buy">기체 구매 상담</option>
                    <option value="edu">조종 교육 문의</option>
                    <option value="as">수리 및 A/S</option>
                    <option value="other">기타 문의</option>
                </select>
            </div>
            <div class="form-group">
                <label>문의 내용 (선택)</label>
                <textarea id="memo" placeholder="농지 면적, 주 재배 작물 등을 적어주시면 더 정확한 상담이 가능합니다."></textarea>
            </div>

            <button class="btn-submit" onclick="submitBooking()">예약 완료하기</button>
        </div>
    </div>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 홈으로 돌아가기</a>

    <!-- 완료 모달 -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="fas fa-calendar-check success-icon"></i>
            <h2>예약 접수 완료</h2>
            <p style="color: var(--text-gray); margin-bottom: 30px;">담당자가 내용을 확인한 후, <br>입력하신 연락처로 확정 안내를 드립니다.</p>
            <a href="index.html" class="btn-submit"
                style="text-decoration: none; display: inline-block; text-align: center;">확인</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <script>
        let selectedDate = '';
        let selectedTime = '';

        // 캘린더 초기화
        flatpickr("#datePicker", {
            locale: "ko",
            minDate: "today",
            disable: [
                function (date) {
                    // 일요일 비활성화
                    return (date.getDay() === 0);
                }
            ],
            onChange: function (selectedDates, dateStr, instance) {
                selectedDate = dateStr;
                updateDisplay();
            }
        });

        // 시간 선택
        const timeBtns = document.querySelectorAll('.time-btn:not(.disabled)');
        timeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                timeBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTime = btn.innerText;
                updateDisplay();
            });
        });

        function updateDisplay() {
            const display = document.getElementById('selectedDateTime');
            if (selectedDate && selectedTime) {
                display.innerHTML = `<i class="fas fa-check"></i> 선택됨: ${selectedDate} ${selectedTime}`;
            } else {
                display.innerText = '';
            }
        }

        // 예약 제출
        function submitBooking() {
            if (!selectedDate || !selectedTime) {
                alert('날짜와 시간을 선택해주세요.');
                return;
            }
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const interest = document.getElementById('interest').value;
            const memo = document.getElementById('memo').value;

            if (!name || !phone) {
                alert('이름과 연락처를 입력해주세요.');
                return;
            }

            const btn = document.querySelector('.btn-submit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 예약 처리 중...';
            btn.disabled = true;

            // 로컬 스토리지에 데이터 저장
            const reservation = {
                id: Date.now(),
                date: selectedDate,
                time: selectedTime,
                name: name,
                phone: phone,
                interest: interest,
                memo: memo,
                timestamp: new Date().toLocaleString()
            };

            let reservations = JSON.parse(localStorage.getItem('reservations')) || [];
            reservations.push(reservation);
            localStorage.setItem('reservations', JSON.stringify(reservations));

            setTimeout(() => {
                document.getElementById('successModal').classList.add('active');
            }, 1000);
        }
    </script>
</body>

</html>
