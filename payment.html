<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초록들판항공 | 안전결제</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { margin:0; background: var(--bg-dark); color: var(--text-white); line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
            background-image: radial-gradient(circle at top right, #064e3b 0%, transparent 40%), radial-gradient(circle at bottom left, #0f172a 0%, transparent 40%);
        }

        .checkout-container {
            width: 100%; max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; }
        }

        /* 왼쪽: 주문 정보 */
        .order-summary { padding: 40px; background: rgba(0, 0, 0, 0.2); }
        .order-summary h2 { margin-top: 0; color: var(--primary); font-size: 1.5rem; }
        .product-item { display: flex; justify-content: space-between; margin: 30px 0; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .product-info h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .product-info p { margin: 0; color: var(--text-gray); font-size: 0.9rem; }
        .product-price { font-weight: bold; font-size: 1.2rem; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; margin-top: 20px; }
        .total-row span:last-child { color: var(--primary); }

        /* 오른쪽: 결제 폼 */
        .payment-form { padding: 40px; }
        .payment-form h2 { margin-top: 0; font-size: 1.5rem; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-gray); font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 15px; border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: white; font-size: 1rem; transition: 0.3s;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2); }
        
        .payment-methods { display: flex; gap: 10px; margin-bottom: 30px; }
        .method-btn {
            flex: 1; padding: 15px; text-align: center; background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
            color: var(--text-gray); transition: 0.3s;
        }
        .method-btn.active { background: rgba(34, 197, 94, 0.1); border-color: var(--primary); color: var(--primary); }
        .method-btn:hover { border-color: var(--primary); }

        .btn-submit {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 18px; border-radius: 12px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* 완료 모달 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.4s; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--card-bg); padding: 50px; border-radius: 24px;
            text-align: center; border: 1px solid var(--border);
            transform: translateY(30px); transition: 0.4s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .success-icon { font-size: 4rem; color: var(--primary); margin-bottom: 20px; }
        .back-link { display: inline-block; margin-top: 20px; color: var(--text-gray); text-decoration: none; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- 주문 요약 -->
        <div class="order-summary">
            <h2><i class="fas fa-shopping-cart"></i> 주문 정보</h2>
            <div class="product-item">
                <div class="product-info">
                    <h3 id="product-name">방제형 드론 Pro 16L</h3>
                    <p>현장 맞춤형 1:1 교육 포함</p>
                </div>
                <div class="product-price" id="product-price">₩3,500,000</div>
            </div>
            
            <div style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 10px; display: flex; justify-content: space-between;">
                <span>배송비</span>
                <span>무료 배송</span>
            </div>
            <div class="total-row">
                <span>총 결제금액</span>
                <span id="total-price">₩3,500,000</span>
            </div>
        </div>

        <!-- 결제 폼 -->
        <div class="payment-form">
            <h2>결제 상세정보</h2>
            <div class="form-group">
                <label>이름</label>
                <input type="text" placeholder="홍길동" required>
            </div>
            <div class="form-group">
                <label>연락처</label>
                <input type="tel" placeholder="010-0000-0000" required>
            </div>
            <div class="form-group">
                <label>배송지 주소</label>
                <input type="text" placeholder="상세 주소를 입력해주세요" required>
            </div>

            <label style="display:block; margin-bottom:10px; color:var(--text-gray); font-size:0.9rem;">결제 수단</label>
            <div class="payment-methods">
                <div class="method-btn active"><i class="fas fa-credit-card"></i><br>신용카드</div>
                <div class="method-btn"><i class="fas fa-money-bill-transfer"></i><br>계좌이체</div>
                <div class="method-btn"><i class="fas fa-mobile-screen"></i><br>간편결제</div>
            </div>

            <button class="btn-submit" onclick="processPayment()">
                <i class="fas fa-lock"></i> 안전하게 결제하기
            </button>
            <a href="index.html" class="back-link" style="display:block; text-align:center;"><i class="fas fa-arrow-left"></i> 돌아가기</a>
        </div>
    </div>

    <!-- 결제 완료 모달 -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <i class="fas fa-check-circle success-icon"></i>
            <h2>결제가 완료되었습니다!</h2>
            <p style="color: var(--text-gray); margin-bottom: 30px;">주문해주셔서 감사합니다. 담당자가 곧 연락드리겠습니다.</p>
            <a href="index.html" class="btn-submit" style="text-decoration: none; display: inline-block;">메인으로 돌아가기</a>
        </div>
    </div>

    <script>
        // URL에서 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const pName = urlParams.get('name');
        const pPrice = urlParams.get('price');

        if(pName && pPrice) {
            document.getElementById('product-name').textContent = pName;
            document.getElementById('product-price').textContent = pPrice;
            document.getElementById('total-price').textContent = pPrice;
        }

        // 결제 수단 선택 로직
        const methods = document.querySelectorAll('.method-btn');
        methods.forEach(btn => {
            btn.addEventListener('click', () => {
                methods.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // 결제 처리 모의 스크립트
        function processPayment() {
            const btn = document.querySelector('.btn-submit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 결제 진행 중...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('successModal').classList.add('active');
            }, 1500);
        }
    </script>
</body>
</html>
