<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초록들판항공 - 공식 스토어</title>
  <style>
    body { margin:0; font-family: Arial; background:#0b1220; color:white; }
    header { background:linear-gradient(90deg,#16a34a,#22c55e); padding:30px; text-align:center; }
    header h1 { margin:0; font-size:32px; }
    nav { text-align:center; padding:10px; background:#020617; }
    nav a { margin:0 15px; color:#4ade80; text-decoration:none; }
    .container { padding:30px; max-width:1200px; margin:auto; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
    .card { background:#111827; padding:20px; border-radius:16px; box-shadow:0 10px 20px rgba(0,0,0,0.5); }
    .card img { width:100%; border-radius:12px; }
    .btn { background:#22c55e; padding:10px; display:inline-block; margin-top:10px; border-radius:8px; cursor:pointer; }
    .hero { text-align:center; padding:60px 20px; }
    .hero h2 { font-size:36px; }
    .dashboard { background:#020617; padding:20px; border-radius:12px; }
    input { padding:10px; width:100%; margin:5px 0; border-radius:8px; border:none; }
    footer { text-align:center; padding:20px; background:#16a34a; margin-top:40px; }
  </style>
</head>
<body>

<header>
  <h1>🚁 초록들판항공</h1>
  <p>농업 드론 솔루션 브랜드</p>
</header>

<nav>
  <a href="#shop">스토어</a>
  <a href="#admin">관리자</a>
</nav>

<div class="hero">
  <h2>농업의 미래는 드론이다</h2>
  <p>직접 만들고, 직접 쓰는 진짜 기술</p>
</div>

<div class="container" id="shop">
  <h2>🛒 제품 스토어</h2>
  <div class="grid" id="productList"></div>
</div>

<div class="container dashboard" id="admin">
  <h2>⚙️ 관리자 (상품 추가)</h2>
  <input id="name" placeholder="제품 이름">
  <input id="price" placeholder="가격">
  <input id="img" placeholder="이미지 URL">
  <div class="btn" onclick="addProduct()">상품 추가</div>
</div>

<footer>
  <p>© 2026 초록들판항공 | 실제 창업 데모</p>
</footer>

<script>
let products = [
  {name:'농업 드론 PRO', price:'₩3,500,000', img:'https://via.placeholder.com/300'},
  {name:'DIY 드론 키트', price:'₩450,000', img:'https://via.placeholder.com/300'}
];

function render() {
  const list = document.getElementById('productList');
  list.innerHTML = '';
  products.forEach(p => {
    list.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>${p.price}</p>
        <div class="btn">구매</div>
      </div>
    `;
  });
}

function addProduct() {
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const img = document.getElementById('img').value;

  products.push({name, price, img});
  render();
}

render();
</script>

</body>
</html>
