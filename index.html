<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초록들판항공 - 공식 스토어</title>
  <style>
    body { margin:0; font-family: Arial; background:#0b1220; color:white; }
    header { background:linear-gradient(90deg,#16a34a,#22c55e); padding:30px; text-align:center; }
    nav { text-align:center; padding:10px; background:#020617; }
    nav a { margin:0 15px; color:#4ade80; text-decoration:none; }
    .container { padding:30px; max-width:1200px; margin:auto; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
    .card { background:#111827; padding:20px; border-radius:16px; }
    .card img { width:100%; border-radius:12px; }
    .btn { background:#22c55e; padding:10px; display:inline-block; margin-top:10px; border-radius:8px; cursor:pointer; }
    .hero { text-align:center; padding:60px 20px; }
    footer { text-align:center; padding:20px; background:#16a34a; margin-top:40px; }
  </style>
</head>
<body>

<header>
  <h1>🚁 초록들판항공</h1>
  <p>농업 드론 솔루션 브랜드</p>
</header>

<nav>
  <a href="#shop">스토어</a>
</nav>

<div class="hero">
  <h2>농업의 미래는 드론이다</h2>
  <p>직접 만들고, 직접 쓰는 진짜 기술</p>
</div>

<div class="container" id="shop">
  <h2>🛒 제품 스토어</h2>
  <div class="grid" id="productList"></div>
</div>

<footer>
  <p>📞 문의: 010-5049-6022 | © 2026 초록들판항공</p>
</footer>

<script>
let products = [
  {name:'농업 드론', price:'₩3,500,000', img:'https://via.placeholder.com/300'},
  {name:'DIY 드론 키트', price:'₩450,000', img:'https://via.placeholder.com/300'}
];

function render() {
  const list = document.getElementById('productList');
  list.innerHTML = '';
  products.forEach(p => {
    list.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>${p.price}</p>
        <div class="btn">문의하기</div>
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
