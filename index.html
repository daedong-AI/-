<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초록들판항공 | 미래를 여는 농업 드론 솔루션</title>
    
    <meta name="description" content="직접 만들고 직접 쓰는 진짜 기술, 초록들판항공의 고성능 농업 드론을 만나보세요.">
    <meta property="og:title" content="초록들판항공 공식 스토어">
    <meta property="og:description" content="농업용 방제 드론 및 DIY 키트 전문 브랜드">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --bg-dark: #020617;
            --card-bg: #0f172a;
            --text-gray: #94a3b8;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { margin:0; background: var(--bg-dark); color:white; scroll-behavior: smooth; }

        /* Header & Nav */
        header { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1508614589041-895b88991e3e?auto=format&fit=crop&q=80&w=1920') center/cover;
            padding: 100px 20px; text-align: center; 
        }
        nav { 
            position: sticky; top: 0; z-index: 1000; 
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px);
            padding: 15px; border-bottom: 1px solid #1e293b;
            display: flex; justify-content: center; gap: 30px;
        }
        nav a { color: var(--text-gray); text-decoration: none; font-weight: 600; transition: 0.3s; }
        nav a:hover { color: var(--primary); }

        /* Hero Section */
        .hero-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        .hero h1 { font-size: 3rem; margin: 10px 0; }

        /* Stats Section */
        .stats { display: flex; justify-content: center; gap: 50px; padding: 40px; background: #0f172a; }
        .stat-item h3 { color: var(--primary); font-size: 1.8rem; margin: 0; }
        .stat-item p { color: var(--text-gray); margin: 5px 0; }

        /* Product Section */
        .container { padding: 80px 20px; max-width: 1200px; margin: auto; }
        .section-title { text-align: center; margin-bottom: 50px; }
        .section-title h2 { font-size: 2.2rem; }
        .section-title p { color: var(--text-gray); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { 
            background: var(--card-bg); border-radius: 24px; overflow: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #1e293b;
        }
        .card:hover { transform: translateY(-15px); border-color: var(--primary); box-shadow: 0 20px 40px rgba(34, 197, 94, 0.15); }
        .card-img-wrapper { height: 200px; overflow: hidden; background: #1e293b; position: relative; }
        .card-img-wrapper i { font-size: 4rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--primary); opacity: 0.3; }
        
        .card-content { padding: 25px; }
        .price { color: var(--primary); font-size: 1.4rem; font-weight: 800; margin: 10px 0; }
        .feature-list { list-style: none; padding: 0; color: var(--text-gray); font-size: 0.9rem; }
        .feature-list li { margin-bottom: 5px; }
        .feature-list li i { color: var(--primary); margin-right: 5px; }

        .btn { 
            background: var(--primary); color: white; padding: 15px; display: block; 
            text-align: center; border-radius: 12px; text-decoration: none; 
            font-weight: bold; margin-top: 20px; transition: 0.3s;
        }
        .btn:hover { background: var(--primary-dark); }

        /* Floating Call Button for Mobile */
        .floating-btn {
            position: fixed; bottom: 30px; right: 30px; 
            background: #22c55e; width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 999; color: white; font-size: 1.5rem;
        }

        footer { background: #020617; padding: 60px 20px; text-align: center; border-top: 1px solid #1e293b; }
        .footer-info { margin-bottom: 20px; color: var(--text-gray); }
    </style>
</head>
<body>

<nav>
    <a href="#home">홈</a>
    <a href="#shop">스토어</a>
    <a href="#about">기술소개</a>
    <a href="tel:01050496022">상담전화</a>
</nav>

<header id="home">
    <div class="hero-badge"><i class="fas fa-check-circle"></i> 현장 맞춤형 솔루션</div>
    <h1>🚁 초록들판항공</h1>
    <p>농업의 효율을 극대화하는 고성능 방제 드론 시스템</p>
</header>

<section class="stats">
    <div class="stat-item">
        <h3>100%</h3>
        <p>자체 정비 지원</p>
    </div>
    <div class="stat-item">
        <h3>2026</h3>
        <p>차세대 모델 출시</p>
    </div>
    <div class="stat-item">
        <h3>24h</h3>
        <p>신속 대응 상담</p>
    </div>
</section>

<div class="container" id="shop">
    <div class="section-title">
        <h2>Premium Store</h2>
        <p>현장의 목소리를 담아 직접 설계한 드론 라인업</p>
    </div>
    <div class="grid" id="productList"></div>
</div>

<a href="tel:01050496022" class="floating-btn"><i class="fas fa-phone"></i></a>

<footer>
    <div class="footer-info">
        <p><strong>(주)초록들판항공</strong></p>
        <p>대표번호: 010-5049-6022 | 경상북도 농업 기술 혁신 단지</p>
        <p>사업자등록번호: [번호입력] | 메일: [이메일입력]</p>
    </div>
    <p style="color: #475569;">© 2026 Chorok Aviation. All Rights Reserved.</p>
</footer>

<script>
const products = [
    {
        name: '헥사-실드 16L 방제 드론', 
        price: '₩3,500,000', 
        icon: 'fa-shuttle-space',
        features: ['1회 방제 2.5에이커', '고정밀 GPS 탑재', '자동 비행 경로 지원']
    },
    {
        name: 'DIY 드론 교육 키트', 
        price: '₩450,000', 
        icon: 'fa-tools',
        features: ['상세 조립 가이드 제공', '비행 제어 센서 포함', '코딩 교육 연계 가능']
    },
    {
        name: '고용량 리튬폴리머 배터리', 
        price: '₩180,000', 
        icon: 'fa-battery-full',
        features: ['급속 충전 지원', '과충전 방지 회로', '장시간 비행 최적화']
    }
];

function render() {
    const list = document.getElementById('productList');
    list.innerHTML = products.map(p => `
        <div class="card">
            <div class="card-img-wrapper">
                <i class="fas ${p.icon}"></i>
            </div>
            <div class="card-content">
                <h3>${p.name}</h3>
                <p class="price">${p.price}</p>
                <ul class="feature-list">
                    ${p.features.map(f => `<li><i class="fas fa-check"></i> ${f}</li>`).join('')}
                </ul>
                <a href="tel:01050496022" class="btn">구매 및 상담</a>
            </div>
        </div>
    `).join('');
}

render();
</script>

</body>
</html>
